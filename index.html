<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <title>Scoreboard</title>
    </head>
    <body>
        <div class="container">
            <div class="score">
                <h3 class="heading">HOME</h3>
                <h2 id="score-home">0</h2>
                <button class="buttons" onclick="home1()">+1</button>
                <button class="buttons" onclick="home2()">+2</button>
                <button class="buttons" onclick="home3()">+3</button>
            </div>
            <button id="reset" onclick="reset()">RESET</button>
            <div class="score">
                <h3 class="heading">AWAY</h3>
                <h2 id="score-away">0</h2>
                <button class="buttons" onclick="away1()">+1</button>
                <button class="buttons" onclick="away2()">+2</button>
                <button class="buttons" onclick="away3()">+3</button>
            </div>

            
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
